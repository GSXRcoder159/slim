name: slim-bloat

on:
  pull_request:

jobs:
  bloat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: node dist/main.js scan --json
