name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearse without publishing or pushing tags
        type: boolean
        default: true
      qualify_run_id:
        description: Successful qualify.yml run that uploaded the complete qualification-bundle
        type: string
        required: false

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: npm ci
      - name: identity gate
        run: node --experimental-strip-types scripts/release-gate.ts --mode identity --registry https://registry.npmjs.org
      - name: resolve qualification bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_RUN_INPUT: ${{ github.event.inputs.qualify_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${QUALIFY_RUN_INPUT:-}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow=qualify.yml --branch main --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "release-gate: missing qualification workflow run for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: verify qualification run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_RUN_ID: ${{ steps.bundle.outputs.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$QUALIFY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "release-gate: qualification run id must be numeric" >&2
            exit 1
          fi
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFY_RUN_ID")"
          jq -e \
            --arg run "$QUALIFY_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg repo "GSXRcoder159/slim" \
            '(
              (.id | tostring) == $run and
              .status == "completed" and
              .conclusion == "success" and
              .path == ".github/workflows/qualify.yml" and
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .repository.full_name == $repo
            )' <<< "$RUN_JSON" >/dev/null || {
              echo "release-gate: supplied run is not a successful qualify.yml run for $GITHUB_REPOSITORY@$GITHUB_SHA" >&2
              exit 1
            }
      - uses: actions/download-artifact@v4
        with:
          name: qualification-bundle
          run-id: ${{ steps.bundle.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualification-bundle
      - name: bind workflow run from the bundled report
        id: report
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/qualification-bundle/qualify-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "release-gate: qualification bundle missing qualify-report.json" >&2
            exit 1
          fi
          CI_RUN="$(jq -r .workflowRun "$REPORT")"
          if [ -z "$CI_RUN" ] || [ "$CI_RUN" = "null" ]; then
            echo "release-gate: qualify-report.json missing workflowRun" >&2
            exit 1
          fi
          echo "workflow_run=$CI_RUN" >> "$GITHUB_OUTPUT"
      - name: rehearse or publish the bundled tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          MODE=rehearse
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then MODE=publish; fi
          if [ "${{ github.event.inputs.rehearse }}" = "false" ]; then MODE=publish; fi
          if [ "$MODE" = "publish" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "release-gate: workflow_dispatch publish is only allowed from main" >&2
            exit 1
          fi
          node --experimental-strip-types scripts/release-gate.ts \
            --mode "$MODE" \
            --bundle "${RUNNER_TEMP}/qualification-bundle" \
            --registry https://registry.npmjs.org \
            --commit "$GITHUB_SHA" \
            --parent-sha "$GITHUB_SHA" \
            --workflow-run "${{ steps.report.outputs.workflow_run }}" \
            --qualification-run "${{ steps.bundle.outputs.run_id }}"
