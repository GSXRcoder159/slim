name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearse without publishing or pushing tags
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: npm ci
      - name: identity gate
        run: node --experimental-strip-types scripts/release-gate.ts --mode identity --registry https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - name: n-gram similarity gate
        run: node --experimental-strip-types scripts/similarity-gate.ts
      - name: pack once
        run: |
          PACK_DIR="${RUNNER_TEMP:-$(mktemp -d)}"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          TAR="$(ls "$PACK_DIR"/*.tgz)"
          test -n "$TAR"
          echo "TARBALL=$TAR" >> "$GITHUB_ENV"
      - name: artifact gate
        run: node --experimental-strip-types scripts/release-gate.ts --mode artifacts --tarball "$TARBALL" --registry https://registry.npmjs.org --commit "$GITHUB_SHA"
      - name: rehearse or publish the packed tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          MODE=rehearse
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then MODE=publish; fi
          if [ "${{ github.event.inputs.rehearse }}" = "false" ]; then MODE=publish; fi
          EXTRA=()
          if [ "$MODE" = "publish" ]; then EXTRA+=(--receipts qualification/receipts); fi
          node --experimental-strip-types scripts/release-gate.ts \
            --mode "$MODE" \
            --tarball "$TARBALL" \
            --registry https://registry.npmjs.org \
            --commit "$GITHUB_SHA" \
            --parent-sha "$GITHUB_SHA" \
            --delete-tarball \
            "${EXTRA[@]}"
