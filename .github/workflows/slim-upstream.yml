name: slim-upstream

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run build
      - uses: ./action/upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slim-upstream-diagnostics
          if-no-files-found: ignore
          path: |
            .slim/
            .slim/UPSTREAM.md
