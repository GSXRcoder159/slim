name: slim-upstream

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: node dist/main.js upstream --pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
