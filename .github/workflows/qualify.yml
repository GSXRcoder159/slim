name: qualify

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "qualify.yml is only allowed from refs/heads/main (got ${GITHUB_REF})" >&2
          exit 1
      - name: require live secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLIM_PR_TRANSFER_OWNER: ${{ secrets.SLIM_PR_TRANSFER_OWNER }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${OPENAI_API_KEY:-}" ] || missing="$missing OPENAI_API_KEY"
          [ -n "${ANTHROPIC_API_KEY:-}" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "${GH_TOKEN:-}" ] || missing="$missing GH_TOKEN"
          [ -n "${SLIM_PR_TRANSFER_OWNER:-}" ] || missing="$missing SLIM_PR_TRANSFER_OWNER"
          if [ -n "$missing" ]; then
            echo "qualify.yml missing secrets:$missing" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - name: resolve successful ci.yml run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow=ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "qualify.yml: no successful ci.yml run for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: qualification-bundle
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-bundle
      - name: verify packed identity matches the CI tarball
        run: |
          node --experimental-strip-types scripts/pack-qualify-bundle.ts \
            --from-bundle "${{ runner.temp }}/ci-bundle" \
            --commit "${{ github.sha }}" \
            --verify
      - name: bind live checks to the CI tarball
        run: |
          set -euo pipefail
          TARBALL="$(find "${{ runner.temp }}/ci-bundle" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "qualify.yml: CI bundle has no tarball" >&2
            exit 1
          fi
          echo "SLIM_QUALIFY_TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: emit local receipts and overlay osNode cells
        env:
          COPYFILE_DISABLE: "1"
          SLIM_WORKFLOW_RUN: ${{ steps.ci.outputs.run_id }}
          SLIM_CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p qualification/receipts
          cp "${{ runner.temp }}/ci-bundle"/receipts/osNode.*.json qualification/receipts/
          NPM="$(jq -r .npmDigest "${{ runner.temp }}/ci-bundle/artifact-identity.json")"
          ACTION="$(jq -r .actionDigest "${{ runner.temp }}/ci-bundle/artifact-identity.json")"
          echo "npmDigest=$NPM" >> "$GITHUB_ENV"
          echo "actionDigest=$ACTION" >> "$GITHUB_ENV"
          node --experimental-strip-types scripts/emit-local-receipts.ts \
            --commit "${{ github.sha }}" \
            --npm-digest "$NPM" \
            --action-digest "$ACTION" \
            --receipts qualification/receipts
          cp "${{ runner.temp }}/ci-bundle"/receipts/osNode.*.json qualification/receipts/
      - name: live support-inventory receipts
        env:
          COPYFILE_DISABLE: "1"
          SLIM_WORKFLOW_RUN: ${{ steps.ci.outputs.run_id }}
          SLIM_CANDIDATE_COMMIT: ${{ github.sha }}
          SLIM_NPM_DIGEST: ${{ env.npmDigest }}
          SLIM_ACTION_DIGEST: ${{ env.actionDigest }}
          SLIM_RECEIPTS_DIR: qualification/receipts
          SLIM_LLM_LIVE: "1"
          SLIM_UPSTREAM_LIVE: "1"
          SLIM_PR_LIVE: "1"
          SLIM_ACTION_LIVE: "1"
          SLIM_RELEASE_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLIM_PR_TRANSFER_OWNER: ${{ secrets.SLIM_PR_TRANSFER_OWNER }}
        run: |
          node --experimental-strip-types --test \
            test/llm-live.test.ts \
            test/upstream-live.test.ts \
            test/github/pr-live.test.ts \
            test/github/action-live.test.ts \
            test/release-live.test.ts
      - name: qualify inventory and write handoff report
        env:
          SLIM_WORKFLOW_RUN: ${{ steps.ci.outputs.run_id }}
          SLIM_CANDIDATE_COMMIT: ${{ github.sha }}
          SLIM_NPM_DIGEST: ${{ env.npmDigest }}
          SLIM_ACTION_DIGEST: ${{ env.actionDigest }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/qualify-receipts.ts \
            --commit "${{ github.sha }}" \
            --npm-digest "$SLIM_NPM_DIGEST" \
            --action-digest "$SLIM_ACTION_DIGEST" \
            --workflow-run "${{ steps.ci.outputs.run_id }}" \
            --receipts qualification/receipts
          node --experimental-strip-types scripts/qualify-handoff.ts \
            --commit "${{ github.sha }}" \
            --npm-digest "$SLIM_NPM_DIGEST" \
            --action-digest "$SLIM_ACTION_DIGEST" \
            --workflow-run "${{ steps.ci.outputs.run_id }}" \
            --qualification-run "${{ github.run_id }}" \
            --receipts qualification/receipts
      - name: pack complete qualification bundle from the CI tarball
        run: |
          node --experimental-strip-types scripts/pack-qualify-bundle.ts \
            --from-bundle "${{ runner.temp }}/ci-bundle" \
            --out "${{ runner.temp }}/qualification-bundle" \
            --receipts qualification/receipts \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-bundle
          path: ${{ runner.temp }}/qualification-bundle
          if-no-files-found: error
