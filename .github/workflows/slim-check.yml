name: slim-check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SLIM_REQUIRE_DIST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run build
      - uses: ./action/check
