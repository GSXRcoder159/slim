name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: fixture check
        working-directory: fixtures/lodash-get-debounce
        run: |
          npm install
          node ../../dist/main.js check
      - name: n-gram similarity gate
        run: node --experimental-strip-types scripts/similarity-gate.ts

  golden-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run build
      - run: npm run refresh:golden -- --check
