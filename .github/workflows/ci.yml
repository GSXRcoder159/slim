name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: fixture check
        working-directory: fixtures/lodash-get-debounce
        run: |
          npm install
          node ../../dist/main.js check
      - name: n-gram similarity gate
        run: node --experimental-strip-types scripts/similarity-gate.ts
