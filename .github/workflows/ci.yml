name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - name: fixture inspect
        working-directory: fixtures/lodash-get-debounce
        run: |
          npm install
          node --experimental-strip-types ../../src/main.ts inspect lodash
      - name: fixture check
        working-directory: fixtures/lodash-get-debounce
        run: node --experimental-strip-types ../../src/main.ts check
      - name: n-gram similarity gate
        run: node --experimental-strip-types scripts/similarity-gate.ts
