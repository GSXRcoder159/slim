name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: fixture check
        working-directory: fixtures/lodash-get-debounce
        run: |
          npm install
          node ../../dist/main.js check
      - name: n-gram similarity gate
        run: node --experimental-strip-types scripts/similarity-gate.ts
      - name: emit osNode receipt
        env:
          COPYFILE_DISABLE: "1"
        run: node --experimental-strip-types scripts/emit-local-receipts.ts --only osNode --pack --commit "${{ github.sha }}" --receipts qualification/receipts
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-osNode-${{ matrix.os }}-${{ matrix.node }}
          path: qualification/receipts/osNode.*.json
          if-no-files-found: error

  golden-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run build
      - run: npm run refresh:golden -- --check
      - run: npm run measure:claims -- --check

  receipts:
    needs: [test, golden-refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - uses: actions/download-artifact@v4
        with:
          pattern: receipt-osNode-*
          merge-multiple: true
          path: qualification/receipts
      - name: require six osNode receipts
        run: |
          set -euo pipefail
          NPM="$(jq -r .npmDigest qualification/receipts/osNode.*.json | sort -u)"
          if [ "$(printf '%s\n' "$NPM" | grep -c .)" != 1 ] || [ "$NPM" = "null" ] || [ -z "$NPM" ]; then
            echo "osNode receipts must share one npmDigest (got: $NPM)" >&2
            exit 1
          fi
          node --experimental-strip-types scripts/qualify-candidate.ts \
            --mode collect \
            --os-node-only \
            --commit "${{ github.sha }}" \
            --npm-digest "$NPM" \
            --receipts qualification/receipts \
            --from qualification/receipts
      - run: npm ci
      - run: npm run build
      - name: pack qualification bundle
        run: |
          node --experimental-strip-types scripts/pack-qualify-bundle.ts \
            --out "${{ runner.temp }}/qualification-bundle" \
            --receipts qualification/receipts \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-bundle
          path: ${{ runner.temp }}/qualification-bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: os-node-receipts
          path: qualification/receipts/osNode.*.json
          if-no-files-found: error
