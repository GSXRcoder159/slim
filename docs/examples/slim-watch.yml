# Consumer example: weekly watch using the published CLI.
# This repository's dogfood workflow is .github/workflows/slim-upstream.yml
# (build dist, SLIM_REQUIRE_DIST, ./action/upstream).
name: slim-watch
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npx --yes slim@1 watch --pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slim-upstream-diagnostics
          if-no-files-found: ignore
          path: .slim/
