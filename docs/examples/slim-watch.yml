# Written by: slim watch --write-workflow
name: slim-watch
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes slim@1 watch --pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
