name: slim/check
description: Re-infer call sites and fail if a Slim envelope grew. Requires Node >= 22.18.
runs:
  using: composite
  steps:
    - name: require Node >= 22.18
      run: |
        major=$(node -p "Number(process.versions.node.split('.')[0])")
        minor=$(node -p "Number(process.versions.node.split('.')[1])")
        if [ "$major" -lt 22 ] || { [ "$major" -eq 22 ] && [ "$minor" -lt 18 ]; }; then
          echo "this Slim action requires Node >= 22.18 (got $(node --version)). Use actions/setup-node with node-version: '22.18'." >&2
          exit 1
        fi
      shell: bash
    - name: slim check
      run: node "${{ github.action_path }}/../run.mjs" check
      shell: bash
